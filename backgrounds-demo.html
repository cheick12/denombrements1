<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backgrounds Demo — Choisissez votre style</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; font-family:'Segoe UI',sans-serif; overflow-x:hidden; }

  /* NAV */
  .nav {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    display:flex; gap:12px; padding:20px 30px;
    background:rgba(0,0,0,0.8); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(201,160,85,0.2);
    overflow-x:auto;
  }
  .nav-btn {
    flex-shrink:0;
    padding:10px 22px; border:1px solid rgba(201,160,85,0.4);
    background:transparent; color:#C9A055;
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; transition:all .3s;
    white-space:nowrap;
  }
  .nav-btn.active, .nav-btn:hover {
    background:#C9A055; color:#050505;
  }

  /* SCENES */
  .scene {
    position:fixed; inset:0;
    display:none; align-items:center; justify-content:center;
  }
  .scene.active { display:flex; }

  /* LABEL */
  .scene-label {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:10; pointer-events:none;
  }
  .scene-label h2 {
    font-size:clamp(28px,5vw,64px);
    font-weight:300; letter-spacing:6px;
    color:#fff; text-transform:uppercase;
    text-shadow:0 0 40px rgba(201,160,85,0.5);
  }
  .scene-label p {
    font-size:11px; letter-spacing:4px; color:rgba(201,160,85,0.8);
    margin-top:8px; text-transform:uppercase;
  }

  canvas { position:absolute; inset:0; width:100%!important; height:100%!important; }

  /* ========================
     BG 1 — PARTICULES DORÉES
  ======================== */
  #scene1 { background:#050505; }

  /* ========================
     BG 2 — GRILLE INFINIE
  ======================== */
  #scene2 { background:#050505; }
  #grid-canvas {
    position:absolute; inset:0;
  }

  /* ========================
     BG 3 — ORBES LUMINEUX
  ======================== */
  #scene3 { background:#050505; overflow:hidden; }
  .orb {
    position:absolute; border-radius:50%;
    filter:blur(80px); mix-blend-mode:screen;
    animation:orbFloat linear infinite;
  }
  @keyframes orbFloat {
    0%   { transform:translate(0,0) scale(1); }
    25%  { transform:translate(30px,-40px) scale(1.1); }
    50%  { transform:translate(-20px,20px) scale(0.9); }
    75%  { transform:translate(40px,30px) scale(1.05); }
    100% { transform:translate(0,0) scale(1); }
  }

  /* ========================
     BG 4 — VAGUES SHADER
  ======================== */
  #scene4 { background:#030308; }

  /* ========================
     BG 5 — ANNEAUX 3D
  ======================== */
  #scene5 { background:#050505; }
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" onclick="showScene(1)">1 — Particules Dorées</button>
  <button class="nav-btn" onclick="showScene(2)">2 — Grille Infinie</button>
  <button class="nav-btn" onclick="showScene(3)">3 — Orbes Lumineux</button>
  <button class="nav-btn" onclick="showScene(4)">4 — Vagues Shader</button>
  <button class="nav-btn" onclick="showScene(5)">5 — Anneaux 3D</button>
</div>

<!-- ========== SCENE 1 : PARTICULES DORÉES ========== -->
<div class="scene active" id="scene1">
  <canvas id="c1"></canvas>
  <div class="scene-label">
    <h2>Particules <em style="color:#C9A055;font-style:italic;">Dorées</em></h2>
    <p>Style Rolls-Royce · Bentley · Blacklane</p>
  </div>
</div>

<!-- ========== SCENE 2 : GRILLE INFINIE ========== -->
<div class="scene" id="scene2">
  <canvas id="c2"></canvas>
  <div class="scene-label">
    <h2>Grille <em style="color:#C9A055;font-style:italic;">Infinie</em></h2>
    <p>Style Bugatti · McLaren · Ferrari</p>
  </div>
</div>

<!-- ========== SCENE 3 : ORBES LUMINEUX ========== -->
<div class="scene" id="scene3">
  <div class="orb" style="width:600px;height:600px;background:rgba(139,26,26,0.6);top:-100px;left:-100px;animation-duration:18s;"></div>
  <div class="orb" style="width:500px;height:500px;background:rgba(201,160,85,0.25);top:20%;right:-80px;animation-duration:22s;animation-delay:-6s;"></div>
  <div class="orb" style="width:700px;height:700px;background:rgba(80,20,20,0.5);bottom:-150px;left:30%;animation-duration:28s;animation-delay:-10s;"></div>
  <div class="orb" style="width:350px;height:350px;background:rgba(201,120,50,0.2);top:50%;left:20%;animation-duration:20s;animation-delay:-4s;"></div>
  <div class="orb" style="width:400px;height:400px;background:rgba(100,10,10,0.4);bottom:10%;right:15%;animation-duration:25s;animation-delay:-12s;"></div>
  <div class="scene-label">
    <h2>Orbes <em style="color:#C9A055;font-style:italic;">Lumineux</em></h2>
    <p>Style Louis Vuitton · Chanel · Azimut</p>
  </div>
</div>

<!-- ========== SCENE 4 : VAGUES SHADER ========== -->
<div class="scene" id="scene4">
  <canvas id="c4"></canvas>
  <div class="scene-label">
    <h2>Vagues <em style="color:#C9A055;font-style:italic;">Fluides</em></h2>
    <p>Style Riva · Azimut Yachts · Porsche</p>
  </div>
</div>

<!-- ========== SCENE 5 : ANNEAUX 3D ========== -->
<div class="scene" id="scene5">
  <canvas id="c5"></canvas>
  <div class="scene-label">
    <h2>Anneaux <em style="color:#C9A055;font-style:italic;">3D</em></h2>
    <p>Style Blacklane · Classe Affaires · Prestige</p>
  </div>
</div>

<script>
// =====================================================
// NAVIGATION
// =====================================================
function showScene(n) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('scene'+n).classList.add('active');
  document.querySelectorAll('.nav-btn')[n-1].classList.add('active');
}

// =====================================================
// SCENE 1 — PARTICULES DORÉES (Three.js)
// =====================================================
(function() {
  const canvas = document.getElementById('c1');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x050505, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.z = 90;

  // Fog
  scene.fog = new THREE.FogExp2(0x050505, 0.008);

  // Particles
  const N = 5000;
  const pos = new Float32Array(N*3);
  const col = new Float32Array(N*3);
  const sz  = new Float32Array(N);

  const gold  = new THREE.Color(0xC9A055);
  const gold2 = new THREE.Color(0xE8C97A);
  const dim   = new THREE.Color(0x333333);
  const red   = new THREE.Color(0x8B1A1A);

  for(let i=0;i<N;i++){
    pos[i*3]   = (Math.random()-.5)*260;
    pos[i*3+1] = (Math.random()-.5)*260;
    pos[i*3+2] = (Math.random()-.5)*120;
    const r = Math.random();
    const c = r>.92 ? gold2 : r>.75 ? gold : r>.6 ? red : dim;
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i] = Math.random()*1.8+0.3;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,1));

  const mat = new THREE.PointsMaterial({
    size:.5, vertexColors:true, transparent:true, opacity:.85, sizeAttenuation:true
  });

  const pts = new THREE.Points(geo,mat);
  scene.add(pts);

  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{
    mx=(e.clientX/innerWidth-.5)*2;
    my=(e.clientY/innerHeight-.5)*2;
  });

  const clock = new THREE.Clock();
  (function tick(){
    requestAnimationFrame(tick);
    const t = clock.getElapsedTime();
    pts.rotation.y = t*.012;
    pts.rotation.x = t*.005;
    camera.position.x += (mx*12-camera.position.x)*.04;
    camera.position.y += (-my*8-camera.position.y)*.04;
    camera.lookAt(scene.position);
    renderer.render(scene,camera);
  })();

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();

// =====================================================
// SCENE 2 — GRILLE INFINIE
// =====================================================
(function() {
  const canvas = document.getElementById('c2');
  const ctx = canvas.getContext('2d');

  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  let t=0;
  let mx=.5, my=.5;
  document.addEventListener('mousemove',e=>{mx=e.clientX/innerWidth; my=e.clientY/innerHeight;});

  function draw(){
    requestAnimationFrame(draw);
    t+=.008;
    ctx.fillStyle='#050505';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const W=canvas.width, H=canvas.height;
    const vx = W/2 + (mx-.5)*60;
    const vy = H*.45 + (my-.5)*20;

    // Horizon glow
    const hg = ctx.createRadialGradient(W/2,vy,0,W/2,vy,W*.6);
    hg.addColorStop(0,'rgba(201,160,85,0.08)');
    hg.addColorStop(.5,'rgba(139,26,26,0.04)');
    hg.addColorStop(1,'transparent');
    ctx.fillStyle=hg;
    ctx.fillRect(0,0,W,H);

    const cols=24, rows=20;
    const spacing = W/cols;
    const offset = (t*spacing*0.4)%spacing;

    ctx.save();

    // Vertical lines
    for(let i=-2;i<=cols+2;i++){
      const x0 = i*spacing - offset;
      const dx = x0-vx;
      const x1 = vx + dx*0.02;
      const dist = Math.abs(dx)/W;
      const alpha = Math.max(0, .4-dist*.6);
      ctx.beginPath();
      ctx.moveTo(x1, vy);
      ctx.lineTo(x0*1.5, H+50);
      const lg=ctx.createLinearGradient(x1,vy,x0,H);
      lg.addColorStop(0,'rgba(201,160,85,'+alpha*.2+')');
      lg.addColorStop(.4,'rgba(201,160,85,'+alpha+')');
      lg.addColorStop(1,'rgba(201,160,85,0)');
      ctx.strokeStyle=lg;
      ctx.lineWidth=.8;
      ctx.stroke();
    }

    // Horizontal lines
    for(let j=0;j<=rows;j++){
      const pct = j/rows;
      const persp = Math.pow(pct,2.2);
      const y = vy + (H-vy+50)*persp;
      if(y<vy) continue;
      const scl = persp;
      const x0 = vx-(W*1.5*scl);
      const x1 = vx+(W*1.5*scl);
      const alpha = Math.max(0,.5*scl-.02);
      ctx.beginPath();
      ctx.moveTo(x0,y); ctx.lineTo(x1,y);
      ctx.strokeStyle='rgba(201,160,85,'+alpha+')';
      ctx.lineWidth=.6;
      ctx.stroke();
    }

    // Horizon line
    ctx.beginPath();
    ctx.moveTo(0,vy); ctx.lineTo(W,vy);
    const hl=ctx.createLinearGradient(0,vy,W,vy);
    hl.addColorStop(0,'transparent');
    hl.addColorStop(.3,'rgba(201,160,85,0.6)');
    hl.addColorStop(.5,'rgba(201,160,85,1)');
    hl.addColorStop(.7,'rgba(201,160,85,0.6)');
    hl.addColorStop(1,'transparent');
    ctx.strokeStyle=hl;
    ctx.lineWidth=1.5;
    ctx.stroke();

    // Glow on horizon
    const glow=ctx.createRadialGradient(W/2,vy,0,W/2,vy,200);
    glow.addColorStop(0,'rgba(201,160,85,0.15)');
    glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;
    ctx.fillRect(0,vy-80,W,160);

    ctx.restore();

    // Top stars
    ctx.save();
    for(let s=0;s<80;s++){
      const sx = (s*137.5)%W;
      const sy = (s*53.7)%(vy*.9);
      const sa = (.3+.7*((s*17)%10/10))*(.5+.5*Math.sin(t+s));
      ctx.beginPath();
      ctx.arc(sx,sy,(.5+s%3*.3),0,Math.PI*2);
      ctx.fillStyle=s%7===0?`rgba(201,160,85,${sa})`:`rgba(255,255,255,${sa*.5})`;
      ctx.fill();
    }
    ctx.restore();
  }
  draw();
})();

// =====================================================
// SCENE 4 — VAGUES SHADER (WebGL)
// =====================================================
(function() {
  const canvas = document.getElementById('c4');
  const gl = canvas.getContext('webgl');
  if(!gl) return;

  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; gl.viewport(0,0,canvas.width,canvas.height); }
  resize();
  window.addEventListener('resize',resize);

  const vert = `
    attribute vec2 a_pos;
    void main(){ gl_Position=vec4(a_pos,0,1); }
  `;
  const frag = `
    precision highp float;
    uniform float u_time;
    uniform vec2  u_res;
    uniform vec2  u_mouse;

    float wave(vec2 uv, float freq, float speed, float amp){
      return sin(uv.x*freq + u_time*speed) * cos(uv.y*freq*.6 + u_time*speed*.8) * amp;
    }

    void main(){
      vec2 uv = (gl_FragCoord.xy - u_res*.5) / u_res.y;
      uv += u_mouse*.15;

      float w = 0.;
      w += wave(uv, 8., 1.2, .06);
      w += wave(uv, 14., .9, .04);
      w += wave(uv, 22., 1.5, .02);
      w += wave(uv*2., 6., .7, .03);

      float bright = smoothstep(-.08,.08,w);

      // Gold color
      vec3 gold = vec3(.78,.63,.33);
      vec3 red  = vec3(.35,.05,.05);
      vec3 dark = vec3(.02,.02,.03);

      vec3 col = mix(dark, red, bright*.4);
      col = mix(col, gold, bright*bright*.8);

      // Scanlines
      float scan = sin(gl_FragCoord.y*.8)*sin(gl_FragCoord.x*.3)*.015;
      col += scan;

      // Vignette
      float vig = 1.-length(uv)*1.2;
      col *= max(0.,vig);

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type,src){
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,frag));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const uTime  = gl.getUniformLocation(prog,'u_time');
  const uRes   = gl.getUniformLocation(prog,'u_res');
  const uMouse = gl.getUniformLocation(prog,'u_mouse');

  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{
    mx=(e.clientX/innerWidth-.5)*2;
    my=-(e.clientY/innerHeight-.5)*2;
  });

  let start = Date.now();
  (function tick(){
    requestAnimationFrame(tick);
    const t=(Date.now()-start)/1000;
    gl.uniform1f(uTime,t);
    gl.uniform2f(uRes,canvas.width,canvas.height);
    gl.uniform2f(uMouse,mx,my);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  })();
})();

// =====================================================
// SCENE 5 — ANNEAUX 3D (Three.js)
// =====================================================
(function() {
  const canvas = document.getElementById('c5');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x050505,1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
  camera.position.set(0,0,90);

  // Particles
  const N=3000;
  const pos=new Float32Array(N*3);
  const col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-.5)*300;
    pos[i*3+1]=(Math.random()-.5)*300;
    pos[i*3+2]=(Math.random()-.5)*100;
    const r=Math.random();
    const c=r>.88?new THREE.Color(0xC9A055):r>.7?new THREE.Color(0x8B1A1A):new THREE.Color(0x222222);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  pg.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(pg, new THREE.PointsMaterial({size:.35,vertexColors:true,transparent:true,opacity:.6})));

  // Rings
  function ring(r,tube,segs,col,op,rx,ry,rz){
    const m=new THREE.Mesh(
      new THREE.TorusGeometry(r,tube,24,segs),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,wireframe:false,side:THREE.DoubleSide})
    );
    m.rotation.set(rx,ry,rz);
    scene.add(m);
    return m;
  }
  function ringWire(r,tube,segs,col,op,rx,ry,rz){
    const m=new THREE.Mesh(
      new THREE.TorusGeometry(r,tube,8,segs),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,wireframe:true})
    );
    m.rotation.set(rx,ry,rz);
    scene.add(m);
    return m;
  }

  const r1=ring(30,.8,128,0xC9A055,.7,Math.PI/4,0,0);
  const r2=ring(22,.5,96,0x8B1A1A,.5,Math.PI/3,Math.PI/5,0);
  const r3=ring(42,.4,160,0xC9A055,.25,Math.PI/2,Math.PI/8,Math.PI/6);
  const r4=ringWire(55,1.5,80,0xC9A055,.1,Math.PI/7,Math.PI/3,Math.PI/4);
  const r5=ring(14,.3,64,0xE8C97A,.9,Math.PI/6,Math.PI/2,0);

  // Center glow (sphere)
  const glowMat=new THREE.MeshBasicMaterial({color:0x8B1A1A,transparent:true,opacity:.15});
  const glow=new THREE.Mesh(new THREE.SphereGeometry(8,32,32),glowMat);
  scene.add(glow);

  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;});

  const clock=new THREE.Clock();
  (function tick(){
    requestAnimationFrame(tick);
    const t=clock.getElapsedTime();
    r1.rotation.x=t*.15; r1.rotation.y=t*.10;
    r2.rotation.x=-t*.12; r2.rotation.z=t*.08;
    r3.rotation.y=t*.07; r3.rotation.z=-t*.05;
    r4.rotation.x=t*.04; r4.rotation.y=-t*.06;
    r5.rotation.y=t*.2; r5.rotation.x=t*.18;
    camera.position.x+=(mx*15-camera.position.x)*.04;
    camera.position.y+=(-my*10-camera.position.y)*.04;
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  })();

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
